[config]
schemaVersion = "0.0.1"

[package]
namespace = "Conductor"
name = "ExpandedWinTracker"
versionNumber = "0.0.1"
description = "Mod that adds tracking for soul savior class combinations among other things."
websiteUrl = "https://github.com/Monster-Train-2-Modding-Group/Expanded-Win-Tracker"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2100"
MT2-Trainworks_Reloaded = "0.7.8"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./"

[[build.copy]]
source = "./plugin_build"
target = ""

[publish]
repository = "https://thunderstore.io"
communities = [ "monster-train-2" ]

[publish.categories]
monster-train-2 = ["misc", "mods", "tools"]
